name: academia-fitzone
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: db_academia_fitzone
      MYSQL_USER: fitzone
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Preencha MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Preencha MYSQL_ROOT_PASSWORD no .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - fitzone_mysql:/var/lib/mysql
      - ./database/01_schema_DanielaBianchi.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  fitzone_mysql:
